project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!docs/"

execute:
  echo: false
  output: false

website:
  title: "Public Health Scotland — Code"
  repo-url: https://github.com/Public-Health-Scotland/public-health-scotland
  repo-actions: [issue]
  navbar: false

format:
  html:
    theme: [cosmo, custom.scss]
    toc: false
    title-block-banner: false
    smooth-scroll: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
